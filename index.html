<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMS Middle School Test Program</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #333; }
    h1 { margin-top: 0; color: #1e293b; }
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; }
    .tab-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; background: #e2e8f0; cursor: pointer; border-radius: 8px 8px 0 0; font-family: inherit; }
    .tab-btn.active { background: #2563eb; color: white; }
    .panel { display: none; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .panel.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #475569; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-family: inherit; }
    textarea { height: 140px; resize: vertical; line-height: 1.5; font-family: inherit; }
    .row { display: flex; gap: 15px; }
    .col { flex: 1; }
    button.btn-submit { background: #2563eb; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-family: inherit; }
    button.btn-submit:hover { background: #1d4ed8; }
    .admin-bar { background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px 20px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .auth-box { background: #fffbe3; border: 1px solid #fde047; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .info-tip { background: #f1f5f9; border-left: 4px solid #0284c7; padding: 10px 15px; margin-bottom: 15px; font-size: 13px; color: #334155; }
    
    /* A4 시험지 기본 설정 */
    .paper { background: white; padding: 25px 30px; border-radius: 8px; max-width: 800px; margin: 20px auto 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
    .paper-header-row { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 12px; }
    .paper-instruction { font-size: 17px; font-weight: bold; color: #1e293b; margin: 0; }
    
    .student-info-box { display: flex; gap: 20px; font-size: 13.5px; font-weight: bold; color: #334155; align-items: center; }
    .info-item { border-bottom: 1px solid #000; padding: 0 10px 1px 10px; display: inline-block; }

    .btn-print { background: #059669; color: white; font-weight: bold; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 10px; float: right; font-family: inherit; }
    .btn-print:hover { background: #047857; }
    
    /* 문제 컨테이너 영역 (문장/단어 시험 구분을 위함) */
    .q-container { display: block; }
    
    /* 단어 시험 2열(2컬럼) 50개 전용 레이아웃 */
    .q-container.vocab-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; row-gap: 2px; }

    /* 문장용 기본 카드 */
    .q-card { margin-bottom: 10px; padding-bottom: 0px; border-bottom: none; page-break-inside: avoid; }
    .q-text { font-size: 13.5px; line-height: 1.35; margin-bottom: 4px; }
    .ans-space { border-bottom: 1px solid #475569; height: 18px; margin-top: 2px; }
    .word-box { background: #f1f5f9; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 2px; font-weight: bold; font-size: 12.5px; font-family: inherit; }

    /* 단어 전용 컴팩트 카드 (A4 50단어 맞춤) */
    .vocab-grid .q-card { margin-bottom: 6px; }
    .vocab-grid .q-text { font-size: 12px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vocab-grid .ans-space { height: 14px; margin-top: 1px; border-bottom-color: #333; }

    /* 인쇄 전용 CSS */
    @media print {
      @page { size: A4; margin: 8mm 10mm; }
      body { background: white; padding: 0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
      h1, .tabs, .auth-box, #genFormSection, .btn-print, #dbTab { display: none !important; }
      .panel { padding: 0; box-shadow: none; }
      .paper { box-shadow: none; padding: 0; max-width: 100%; margin: 0; }
      .paper-header-row { border-bottom-color: #000; margin-bottom: 8px; padding-bottom: 4px; }
      .student-info-box { color: #000; }
      
      .q-card { margin-bottom: 8px; }
      .q-text { font-size: 13px; }
      .ans-space { height: 16px; border-bottom-color: #000; }

      /* 인쇄 시 단어 시험 2열 50개 맞춤 규격 */
      .q-container.vocab-grid { column-gap: 20px; row-gap: 1px; }
      .vocab-grid .q-card { margin-bottom: 4px; }
      .vocab-grid .q-text { font-size: 11.5px; }
      .vocab-grid .ans-space { height: 12px; border-bottom-color: #000; }
    }
  </style>

  <!-- 파이어베이스 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>📚 YMS Middle School Test Program</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('genTab')">📝 문제지 생성하기 (인증 사용자)</button>
    <button class="tab-btn" onclick="switchTab('dbTab')">⚙️ 지문/단어 DB 관리 (선생님 전용)</button>
  </div>

  <!-- 1. 문제지 생성 탭 -->
  <div id="genTab" class="panel active">
    <div class="auth-box">
      <label>📱 사용자 인증 (핸드폰 번호 뒷자리 4자리 입력)</label>
      <div style="display:flex; gap:10px;">
        <input type="password" id="userPhonePin" placeholder="예: 1234" maxlength="4" style="width:150px;">
        <button style="padding:10px 15px; background:#eab308; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="verifyUserPin()">인증 확인</button>
      </div>
      <span id="authStatusText" style="font-size:13px; margin-top:5px; display:block; color:#ca8a04;">* 등록된 번호 입력 시 문제 생성이 가능합니다.</span>
    </div>

    <div id="genFormSection" style="opacity: 0.5; pointer-events: none;">
      <div class="row form-group">
        <div class="col">
          <label>시험 종류 선택</label>
          <select id="genCategory" onchange="updateLessonDropdown()">
            <option value="sentence">📖 문장/지문 시험</option>
            <option value="vocab">🔤 단어 시험</option>
          </select>
        </div>
        <div class="col">
          <label>교과서/시험지 선택</label>
          <select id="genTb" onchange="updateLessonDropdown()"></select>
        </div>
        <div class="col">
          <label>과/단원 선택</label>
          <select id="genLesson" onchange="updateSentenceDropdowns()"></select>
        </div>
      </div>

      <!-- 문장 시험용 옵션 -->
      <div id="sentenceOptions">
        <div class="row form-group">
          <div class="col">
            <label>시작 문장 선택</label>
            <select id="genStart"></select>
          </div>
          <div class="col">
            <label>끝 문장 선택</label>
            <select id="genEnd"></select>
          </div>
        </div>
      </div>

      <div class="row form-group">
        <div class="col">
          <label>문제 유형</label>
          <select id="genType" onchange="toggleBlankOption()"></select>
        </div>
        <div class="col" id="blankOptionCol" style="display: none;">
          <label>빈칸 개수 (비율)</label>
          <select id="blankRatio">
            <option value="0.2">조금 (약 20% 단어)</option>
            <option value="0.4" selected>보통 (약 40% 단어)</option>
            <option value="0.6">많이 (약 60% 단어)</option>
            <option value="0.8">매우 많이 (약 80% 단어)</option>
          </select>
        </div>
      </div>
      <button class="btn-submit" onclick="fetchAndGenerate()">문제지 만들기</button>
    </div>

    <div class="paper" id="paperArea" style="display:none;"></div>
  </div>

  <!-- 2. 지문 DB 관리 탭 -->
  <div id="dbTab" class="panel">
    <div id="loginSection">
      <h3>🔒 관리자 로그인</h3>
      <div class="form-group">
        <label>관리자 이메일</label>
        <input type="email" id="loginEmail" value="ddkimhere1984@gmail.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPw" value="bong0107!!">
      </div>
      <button class="btn-submit" onclick="handleLogin()">로그인</button>
    </div>

    <div id="adminSection" style="display:none;">
      <div class="admin-bar">
        <span>👤 관리자(<b id="userEmailText"></b>) 로그인됨</span>
        <button style="padding:6px 12px; background:#ef4444; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="handleLogout()">로그아웃</button>
      </div>

      <div style="background:#f8fafc; padding:15px; border:1px solid #e2e8f0; border-radius:6px; margin-bottom:20px;">
        <h4 style="margin-top:0;">📱 허용 사용자 핸드폰 뒷자리 등록</h4>
        <div style="display:flex; gap:10px;">
          <input type="text" id="newAllowedPin" placeholder="뒷자리 4자리 (예: 1234)" maxlength="4" style="width:200px;">
          <button style="padding:10px; background:#0284c7; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="addAllowedPin()">등록하기</button>
        </div>
      </div>

      <hr style="margin:20px 0; border:none; border-top:1px solid #cbd5e1;">

      <!-- 지문 일괄 추가 -->
      <h3>➕ 1. 문장/지문 DB 일괄 추가</h3>
      <div class="row form-group">
        <div class="col"><label>교과서 코드</label><input type="text" id="dbTb" value="동아_윤_2"></div>
        <div class="col"><label>과 번호</label><input type="number" id="dbLesson" value="1"></div>
        <div class="col"><label>시작 문장 번호</label><input type="number" id="dbStartNum" value="1"></div>
      </div>
      <div class="form-group">
        <label>영어 문장 목록 (한 줄에 한 문장씩)</label>
        <textarea id="dbEng" placeholder="1. Somin is a 15-year-old middle school student in Korea."></textarea>
      </div>
      <div class="form-group">
        <label>한글 해석 목록 (한 줄에 한 문장씩)</label>
        <textarea id="dbKor" placeholder="1. 소민이는 한국에 사는 15세 중학생입니다."></textarea>
      </div>
      <button class="btn-submit" style="background:#059669; margin-bottom:30px;" onclick="saveBatchToFirebase()">[문장 지문 DB 저장]</button>

      <!-- 단어 일괄 추가 -->
      <h3>➕ 2. 단어 DB 일괄 추가</h3>
      <div class="info-tip">
        💡 <b>입력 예시:</b> <code>apple / 사과</code> 또는 <code>banana - 바나나</code> 처럼 한 줄에 한 단어씩 복사해서 넣으시면 됩니다.
      </div>
      <div class="row form-group">
        <div class="col"><label>교과서 코드</label><input type="text" id="dbWordTb" value="동아_윤_2"></div>
        <div class="col"><label>과 번호</label><input type="number" id="dbWordLesson" value="1"></div>
      </div>
      <div class="form-group">
        <label>단어 및 뜻 목록 (한 줄에 '단어 / 뜻' 형식)</label>
        <textarea id="dbWords" placeholder="apple / 사과&#10;banana / 바나나&#10;take photos / 사진을 찍다"></textarea>
      </div>
      <button class="btn-submit" style="background:#0284c7;" onclick="saveWordsToFirebase()">[단어 DB 저장]</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQU7tXEVtN-W-KbMWlXyevqPnaQoUND40",
      authDomain: "school-test-b8d9c.firebaseapp.com",
      projectId: "school-test-b8d9c",
      storageBucket: "school-test-b8d9c.firebasestorage.app",
      messagingSenderId: "908472962565",
      appId: "1:908472962565:web:365396e9008d1258f3d66c",
      measurementId: "G-DZGC4P918C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let isPinVerified = false;
    let dbSentenceMap = {};
    let dbWordMap = {};

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
        document.getElementById('userEmailText').innerText = user.email;
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminSection').style.display = 'none';
      }
    });

    function switchTab(tabId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function toggleBlankOption() {
      const category = document.getElementById('genCategory').value;
      const qType = document.getElementById('genType').value;
      const blankCol = document.getElementById('blankOptionCol');
      blankCol.style.display = (category === "sentence" && qType === "4") ? "block" : "none";
    }

    function verifyUserPin() {
      const pin = document.getElementById('userPhonePin').value.trim();
      if (pin.length !== 4) return alert("핸드폰 번호 뒷자리 4자리를 입력해 주세요.");

      db.collection("allowed_users").doc(pin).get().then(doc => {
        if (doc.exists) {
          isPinVerified = true;
          document.getElementById('authStatusText').innerText = "⏳ 인증 성공! DB 목록을 불러오는 중입니다...";
          document.getElementById('authStatusText').style.color = "#16a34a";
          document.getElementById('genFormSection').style.opacity = "1";
          document.getElementById('genFormSection').style.pointerEvents = "auto";
          
          loadDropdownsFromDB();
        } else {
          isPinVerified = false;
          document.getElementById('authStatusText').innerText = "❌ 등록되지 않은 사용자 번호입니다.";
          document.getElementById('authStatusText').style.color = "#dc2626";
          document.getElementById('genFormSection').style.opacity = "0.5";
          document.getElementById('genFormSection').style.pointerEvents = "none";
        }
      }).catch(err => alert("인증 오류: " + err.message));
    }

    async function loadDropdownsFromDB() {
      try {
        const sentenceSnapshot = await db.collection("sentences").get();
        dbSentenceMap = {};
        sentenceSnapshot.forEach(doc => {
          const data = doc.data();
          const { tbCode: tb, lesson, num, eng = "" } = data;
          if (!dbSentenceMap[tb]) dbSentenceMap[tb] = {};
          if (!dbSentenceMap[tb][lesson]) dbSentenceMap[tb][lesson] = [];
          if (!dbSentenceMap[tb][lesson].some(s => s.num === num)) {
            dbSentenceMap[tb][lesson].push({ num, eng });
          }
        });

        const wordSnapshot = await db.collection("words").get();
        dbWordMap = {};
        wordSnapshot.forEach(doc => {
          const data = doc.data();
          const { tbCode: tb, lesson, word, meaning } = data;
          if (!dbWordMap[tb]) dbWordMap[tb] = {};
          if (!dbWordMap[tb][lesson]) dbWordMap[tb][lesson] = [];
          dbWordMap[tb][lesson].push({ word, meaning });
        });

        document.getElementById('authStatusText').innerText = "✅ 인증 성공! 목록에서 지문을 선택해 문제지를 생성하세요.";
        updateLessonDropdown();
      } catch (err) {
        alert("DB 목록 로드 실패: " + err.message);
      }
    }

    function updateLessonDropdown() {
      const category = document.getElementById('genCategory').value;
      const targetMap = (category === "sentence") ? dbSentenceMap : dbWordMap;
      const genTbSelect = document.getElementById('genTb');
      const genTypeSelect = document.getElementById('genType');
      
      genTbSelect.innerHTML = "";

      if (category === "sentence") {
        document.getElementById('sentenceOptions').style.display = "block";
        genTypeSelect.innerHTML = `
          <option value="1">1. 해석하기 (Eng → Kor)</option>
          <option value="2">2. 영어쓰기 (Kor → Eng)</option>
          <option value="3">3. 단어 배열하기</option>
          <option value="4">4. 빈칸 채우기</option>
        `;
      } else {
        document.getElementById('sentenceOptions').style.display = "none";
        genTypeSelect.innerHTML = `
          <option value="w1">1. 뜻만 보기 (Eng → Kor)</option>
          <option value="w2">2. 영어만 보기 (Kor → Eng)</option>
          <option value="w3">3. 섞어서 보기 (랜덤)</option>
        `;
      }
      toggleBlankOption();

      const tbKeys = Object.keys(targetMap);
      if (tbKeys.length === 0) {
        genTbSelect.innerHTML = "<option value=''>등록된 데이터가 없습니다</option>";
        return;
      }

      tbKeys.forEach(tb => {
        const opt = document.createElement('option');
        opt.value = tb;
        opt.innerText = tb;
        genTbSelect.appendChild(opt);
      });

      const selectedTb = genTbSelect.value;
      const genLessonSelect = document.getElementById('genLesson');
      genLessonSelect.innerHTML = "";

      if (selectedTb && targetMap[selectedTb]) {
        const lessons = Object.keys(targetMap[selectedTb]).map(Number).sort((a, b) => a - b);
        lessons.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l;
          opt.innerText = `${l}과`;
          genLessonSelect.appendChild(opt);
        });
      }

      updateSentenceDropdowns();
    }

    function updateSentenceDropdowns() {
      const category = document.getElementById('genCategory').value;
      if (category !== "sentence") return;

      const selectedTb = document.getElementById('genTb').value;
      const selectedLesson = document.getElementById('genLesson').value;
      const genStartSelect = document.getElementById('genStart');
      const genEndSelect = document.getElementById('genEnd');

      genStartSelect.innerHTML = "";
      genEndSelect.innerHTML = "";

      if (!selectedTb || !selectedLesson || !dbSentenceMap[selectedTb] || !dbSentenceMap[selectedTb][selectedLesson]) return;

      const sentences = dbSentenceMap[selectedTb][selectedLesson];
      sentences.sort((a, b) => a.num - b.num);

      const addedNums = new Set();
      sentences.forEach(item => {
        if (!addedNums.has(item.num)) {
          addedNums.add(item.num);
          const preview = item.eng.length > 25 ? item.eng.substring(0, 25) + "..." : item.eng;
          const label = `${item.num}번: ${preview}`;

          const optStart = document.createElement('option');
          optStart.value = item.num;
          optStart.innerText = label;
          genStartSelect.appendChild(optStart);

          const optEnd = document.createElement('option');
          optEnd.value = item.num;
          optEnd.innerText = label;
          genEndSelect.appendChild(optEnd);
        }
      });

      if (sentences.length > 0) {
        genEndSelect.value = sentences[sentences.length - 1].num;
      }
    }

    function addAllowedPin() {
      const pin = document.getElementById('newAllowedPin').value.trim();
      if (pin.length !== 4) return alert("4자리 숫자를 입력해 주세요.");

      db.collection("allowed_users").doc(pin).set({
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert(`승인 번호 [${pin}] 번이 성공적으로 추가되었습니다.`);
        document.getElementById('newAllowedPin').value = "";
      }).catch(err => alert("추가 실패: " + err.message));
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pw = document.getElementById('loginPw').value;
      auth.signInWithEmailAndPassword(email, pw).catch(err => alert("로그인 실패: 이메일과 비밀번호를 확인해주세요."));
    }

    function handleLogout() { auth.signOut(); }

    function cleanSentence(str) { return str.replace(/^\d+[\.\)\:]\s*/, '').trim(); }

    async function saveBatchToFirebase() {
      const tb = document.getElementById('dbTb').value.trim();
      const lesson = parseInt(document.getElementById('dbLesson').value);
      const startNum = parseInt(document.getElementById('dbStartNum').value);
      const rawEng = document.getElementById('dbEng').value.trim();
      const rawKor = document.getElementById('dbKor').value.trim();

      if (!tb || !rawEng || !rawKor) return alert("모든 항목을 입력해 주세요.");

      const engList = rawEng.split('\n').map(s => cleanSentence(s)).filter(s => s.length > 0);
      const korList = rawKor.split('\n').map(s => cleanSentence(s)).filter(s => s.length > 0);

      if (engList.length !== korList.length) return alert("영어와 한글의 문장 수가 일치하지 않습니다.");

      const batch = db.batch();
      engList.forEach((eng, idx) => {
        const docRef = db.collection("sentences").doc();
        batch.set(docRef, { tbCode: tb, lesson, num: startNum + idx, eng, kor: korList[idx], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });

      try {
        await batch.commit();
        alert(`총 ${engList.length}개 문장이 성공적으로 DB에 저장되었습니다!`);
        document.getElementById('dbStartNum').value = startNum + engList.length;
        document.getElementById('dbEng').value = ""; document.getElementById('dbKor').value = "";
      } catch (err) { alert("저장 실패: " + err.message); }
    }

    async function saveWordsToFirebase() {
      const tb = document.getElementById('dbWordTb').value.trim();
      const lesson = parseInt(document.getElementById('dbWordLesson').value);
      const rawWords = document.getElementById('dbWords').value.trim();

      if (!tb || !rawWords) return alert("교과서 코드와 단어 목록을 입력해 주세요.");

      const lines = rawWords.split('\n').filter(l => l.trim().length > 0);
      const batch = db.batch();
      let count = 0;

      lines.forEach(line => {
        const parts = line.split(/[\/\-\:]/);
        if (parts.length >= 2) {
          const word = parts[0].trim();
          const meaning = parts.slice(1).join('/').trim();
          const docRef = db.collection("words").doc();
          batch.set(docRef, { tbCode: tb, lesson, word, meaning, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          count++;
        }
      });

      if (count === 0) return alert("올바른 단어/뜻 형식으로 입력해 주세요. 예: apple / 사과");

      try {
        await batch.commit();
        alert(`총 ${count}개 단어가 DB에 저장되었습니다!`);
        document.getElementById('dbWords').value = "";
      } catch (err) { alert("저장 실패: " + err.message); }
    }

    function fetchAndGenerate() {
      if (!isPinVerified) return alert("먼저 핸드폰 번호 뒷자리 인증을 완료해 주세요.");

      const category = document.getElementById('genCategory').value;
      const tb = document.getElementById('genTb').value;
      const lesson = parseInt(document.getElementById('genLesson').value);
      const qType = document.getElementById('genType').value;

      if (!tb || isNaN(lesson)) return alert("지문 데이터를 올바르게 선택해 주세요.");

      if (category === "sentence") {
        const start = parseInt(document.getElementById('genStart').value);
        const end = parseInt(document.getElementById('genEnd').value);

        db.collection("sentences").where("tbCode", "==", tb).where("lesson", "==", lesson).get()
          .then(snapshot => {
            let map = new Map();
            snapshot.forEach(doc => {
              const data = doc.data();
              if (data.num >= start && data.num <= end && !map.has(data.num)) map.set(data.num, data);
            });
            let list = Array.from(map.values()).sort((a, b) => a.num - b.num);
            renderPaper(list, qType, "sentence");
          });
      } else {
        db.collection("words").where("tbCode", "==", tb).where("lesson", "==", lesson).get()
          .then(snapshot => {
            let list = [];
            snapshot.forEach(doc => list.push(doc.data()));
            renderPaper(list, qType, "vocab");
          });
      }
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function renderPaper(dataList, qType, category) {
      const paper = document.getElementById('paperArea');
      paper.style.display = "block";
      paper.innerHTML = "";

      if (dataList.length === 0) {
        paper.innerHTML = "<p style='text-align:center;'>해당 조건의 문제 데이터가 없습니다.</p>";
        return;
      }

      // 상단 인쇄 버튼
      const topBar = document.createElement('div');
      topBar.style.overflow = "hidden";
      topBar.style.marginBottom = "5px";

      const printBtn = document.createElement('button');
      printBtn.className = "btn-print";
      printBtn.innerText = "🖨️ 시험지 인쇄하기";
      printBtn.onclick = () => window.print();
      topBar.appendChild(printBtn);
      paper.appendChild(topBar);

      const instructions = {
        "1": "다음 문장을 해석하시오.", "2": "다음 우리말을 영작하시오.",
        "3": "주어진 단어를 올바르게 배열하시오.", "4": "다음 문장의 빈칸에 알맞은 단어를 쓰시오.",
        "w1": "다음 영어 단어의 뜻을 쓰시오.", "w2": "다음 뜻에 알맞은 영어 단어를 쓰시오.", "w3": "다음 알맞은 영단어 또는 뜻을 쓰시오."
      };

      const headerRow = document.createElement('div');
      headerRow.className = "paper-header-row";
      
      const titleDiv = document.createElement('div');
      titleDiv.className = "paper-instruction";
      titleDiv.innerText = instructions[qType] || "다음 문제를 푸시오.";

      const studentInfo = document.createElement('div');
      studentInfo.className = "student-info-box";
      studentInfo.innerHTML = `
        <span>날짜: <span class="info-item" style="width: 90px;"></span></span>
        <span>이름: <span class="info-item" style="width: 90px;"></span></span>
      `;

      headerRow.appendChild(titleDiv);
      headerRow.appendChild(studentInfo);
      paper.appendChild(headerRow);

      const blankRatio = parseFloat(document.getElementById('blankRatio').value) || 0.4;

      // 문제 생성 컨테이너 (단어 시험일 경우 2열 그리드 클래스 추가)
      const container = document.createElement('div');
      container.className = (category === "vocab") ? "q-container vocab-grid" : "q-container";

      dataList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = "q-card";

        const qNumberStr = `${idx + 1}. `;
        let html = "";

        if (category === "sentence") {
          if (qType === "1") {
            html = `<div class="q-text"><b>${qNumberStr}${item.eng}</b></div><div class="ans-space"></div>`;
          } else if (qType === "2") {
            html = `<div class="q-text"><b>${qNumberStr}${item.kor}</b></div><div class="ans-space"></div>`;
          } else if (qType === "3") {
            const words = shuffle(item.eng.replace(/[.,!?]/g, '').split(" ")).join(" / ");
            html = `<div class="q-text" style="font-size:12.5px; color:#555; margin-bottom:2px;">${qNumberStr}뜻: ${item.kor}</div>
                    <div class="word-box">[ ${words} ]</div><div class="ans-space"></div>`;
          } else if (qType === "4") {
            const words = item.eng.split(" ");
            const blanked = words.map(w => (w.replace(/[^a-zA-Z]/g, '').length >= 2 && Math.random() < blankRatio) ? "_______" : w).join(" ");
            html = `<div class="q-text"><b>${qNumberStr}${blanked}</b></div><div style="font-size:12px; color:#555; margin-top:-3px;">(뜻: ${item.kor})</div><div class="ans-space"></div>`;
          }
        } else {
          // 단어 시험 처리 (2열 전용)
          let isShowEng = (qType === "w1") ? true : (qType === "w2" ? false : Math.random() > 0.5);
          
          if (isShowEng) {
            html = `<div class="q-text"><b>${qNumberStr}${item.word}</b></div><div class="ans-space"></div>`;
          } else {
            html = `<div class="q-text"><b>${qNumberStr}${item.meaning}</b></div><div class="ans-space"></div>`;
          }
        }

        card.innerHTML = html;
        container.appendChild(card);
      });

      paper.appendChild(container);
    }
  </script>
</body>
