<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMS Middle School Test Program</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #333; }
    h1 { margin-top: 0; color: #1e293b; }
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; }
    .tab-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; background: #e2e8f0; cursor: pointer; border-radius: 8px 8px 0 0; }
    .tab-btn.active { background: #2563eb; color: white; }
    .panel { display: none; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .panel.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #475569; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    textarea { height: 140px; resize: vertical; line-height: 1.5; font-family: inherit; }
    .row { display: flex; gap: 15px; }
    .col { flex: 1; }
    button.btn-submit { background: #2563eb; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
    button.btn-submit:hover { background: #1d4ed8; }
    .admin-bar { background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px 20px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .auth-box { background: #fffbe3; border: 1px solid #fde047; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .info-tip { background: #f1f5f9; border-left: 4px solid #0284c7; padding: 10px 15px; margin-bottom: 15px; font-size: 13px; color: #334155; }
    
    /* 문제지 출력 스타일 */
    .paper { background: white; padding: 40px; border-radius: 8px; max-width: 800px; margin: 20px auto 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .q-card { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
    .q-num { font-weight: bold; color: #2563eb; margin-bottom: 8px; }
    .q-text { font-size: 16px; line-height: 1.6; margin-bottom: 10px; }
    .ans-space { border-bottom: 1px solid #94a3b8; height: 35px; margin-top: 10px; }
    .word-box { background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace; display: inline-block; margin-bottom: 10px; font-weight: bold; }
  </style>

  <!-- 파이어베이스 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>📚 YMS Middle School Test Program</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('genTab')">📝 문제지 생성하기 (인증 사용자)</button>
    <button class="tab-btn" onclick="switchTab('dbTab')">⚙️ 지문 DB 관리 (선생님 전용)</button>
  </div>

  <!-- 1. 문제지 생성 탭 -->
  <div id="genTab" class="panel active">
    <div class="auth-box">
      <label>📱 사용자 인증 (핸드폰 번호 뒷자리 4자리 입력)</label>
      <div style="display:flex; gap:10px;">
        <input type="password" id="userPhonePin" placeholder="예: 1234" maxlength="4" style="width:150px;">
        <button style="padding:10px 15px; background:#eab308; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="verifyUserPin()">인증 확인</button>
      </div>
      <span id="authStatusText" style="font-size:13px; margin-top:5px; display:block; color:#ca8a04;">* 등록된 번호 입력 시 문제 생성이 가능합니다.</span>
    </div>

    <!-- DB에서 불러온 펼침 목록 (Select Box) -->
    <div id="genFormSection" style="opacity: 0.5; pointer-events: none;">
      <div class="row form-group">
        <div class="col">
          <label>교과서 선택</label>
          <select id="genTb" onchange="updateLessonDropdown()">
            <option value="">인증 후 교과서 목록이 표시됩니다</option>
          </select>
        </div>
        <div class="col">
          <label>과 선택</label>
          <select id="genLesson" onchange="updateSentenceDropdowns()">
            <option value="">교과서를 먼저 선택하세요</option>
          </select>
        </div>
      </div>
      <div class="row form-group">
        <div class="col">
          <label>시작 문장 선택</label>
          <select id="genStart"></select>
        </div>
        <div class="col">
          <label>끝 문장 선택</label>
          <select id="genEnd"></select>
        </div>
      </div>
      <div class="form-group">
        <label>문제 유형</label>
        <select id="genType">
          <option value="1">1. 해석하기 (Eng → Kor)</option>
          <option value="2">2. 영어쓰기 (Kor → Eng)</option>
          <option value="3">3. 단어 배열하기</option>
          <option value="4">4. 빈칸 채우기</option>
        </select>
      </div>
      <button class="btn-submit" onclick="fetchAndGenerate()">문제지 만들기</button>
    </div>

    <div class="paper" id="paperArea" style="display:none;"></div>
  </div>

  <!-- 2. 지문 DB 관리 탭 -->
  <div id="dbTab" class="panel">
    <div id="loginSection">
      <h3>🔒 관리자 로그인</h3>
      <div class="form-group">
        <label>관리자 이메일</label>
        <input type="email" id="loginEmail" value="ddkimhere1984@gmail.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPw" value="bong0107!!">
      </div>
      <button class="btn-submit" onclick="handleLogin()">로그인</button>
      <p style="margin-top:12px; font-size:13px; color:#666;">
        * 최초 1회 계정 생성: 
        <a href="#" onclick="handleSignUp()" style="color:#2563eb; font-weight:bold;">[이 이메일로 최초 가입]</a>
      </p>
    </div>

    <div id="adminSection" style="display:none;">
      <div class="admin-bar">
        <span>👤 관리자(<b id="userEmailText"></b>) 로그인됨</span>
        <button style="padding:6px 12px; background:#ef4444; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="handleLogout()">로그아웃</button>
      </div>

      <div style="background:#f8fafc; padding:15px; border:1px solid #e2e8f0; border-radius:6px; margin-bottom:20px;">
        <h4 style="margin-top:0;">📱 허용 사용자 핸드폰 뒷자리 등록</h4>
        <div style="display:flex; gap:10px;">
          <input type="text" id="newAllowedPin" placeholder="뒷자리 4자리 (예: 1234)" maxlength="4" style="width:200px;">
          <button style="padding:10px; background:#0284c7; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="addAllowedPin()">등록하기</button>
        </div>
      </div>

      <h3>➕ 구글 클라우드 DB에 지문 일괄 추가</h3>
      
      <div class="info-tip">
        💡 <b>사용 팁:</b> 줄바꿈(Enter) 기준으로 여러 문장을 한 번에 복사해서 넣으시면 됩니다. 앞에 '1. ' 같은 번호가 붙어있어도 자동으로 제거되며 지정한 시작 번호부터 순서대로 자동 저장됩니다.
      </div>

      <div class="row form-group">
        <div class="col"><label>교과서 코드</label><input type="text" id="dbTb" value="동아_윤_2"></div>
        <div class="col"><label>과 번호</label><input type="number" id="dbLesson" value="1"></div>
        <div class="col"><label>시작 문장 번호</label><input type="number" id="dbStartNum" value="1"></div>
      </div>
      
      <div class="form-group">
        <label>영어 문장 목록 (한 줄에 한 문장씩)</label>
        <textarea id="dbEng" placeholder="1. Somin is a 15-year-old middle school student in Korea.&#10;2. She likes to take photos."></textarea>
      </div>
      
      <div class="form-group">
        <label>한글 해석 목록 (한 줄에 한 문장씩)</label>
        <textarea id="dbKor" placeholder="1. 소민이는 한국에 사는 15세 중학생입니다.&#10;2. 그녀는 사진 찍는 것을 좋아합니다."></textarea>
      </div>
      
      <button class="btn-submit" style="background:#059669;" onclick="saveBatchToFirebase()">일괄 DB에 저장하기</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQU7tXEVtN-W-KbMWlXyevqPnaQoUND40",
      authDomain: "school-test-b8d9c.firebaseapp.com",
      projectId: "school-test-b8d9c",
      storageBucket: "school-test-b8d9c.firebasestorage.app",
      messagingSenderId: "908472962565",
      appId: "1:908472962565:web:365396e9008d1258f3d66c",
      measurementId: "G-DZGC4P918C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let isPinVerified = false;
    let dbSentenceMap = {};

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
        document.getElementById('userEmailText').innerText = user.email;
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminSection').style.display = 'none';
      }
    });

    function switchTab(tabId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // 1. 핸드폰 뒷자리 검증 및 드롭다운 로드
    function verifyUserPin() {
      const pin = document.getElementById('userPhonePin').value.trim();
      if (pin.length !== 4) return alert("핸드폰 번호 뒷자리 4자리를 입력해 주세요.");

      db.collection("allowed_users").doc(pin).get().then(doc => {
        if (doc.exists) {
          isPinVerified = true;
          document.getElementById('authStatusText').innerText = "⏳ 인증 성공! DB 목록을 불러오는 중입니다...";
          document.getElementById('authStatusText').style.color = "#16a34a";
          document.getElementById('genFormSection').style.opacity = "1";
          document.getElementById('genFormSection').style.pointerEvents = "auto";
          
          loadDropdownsFromDB();
        } else {
          isPinVerified = false;
          document.getElementById('authStatusText').innerText = "❌ 등록되지 않은 사용자 번호입니다.";
          document.getElementById('authStatusText').style.color = "#dc2626";
          document.getElementById('genFormSection').style.opacity = "0.5";
          document.getElementById('genFormSection').style.pointerEvents = "none";
        }
      }).catch(err => alert("인증 오류: " + err.message));
    }

    // 2. DB에서 전체 조회하여 드롭다운 생성
    async function loadDropdownsFromDB() {
      try {
        const snapshot = await db.collection("sentences").get();
        dbSentenceMap = {};

        snapshot.forEach(doc => {
          const data = doc.data();
          const tb = data.tbCode;
          const lesson = data.lesson;
          const num = data.num;
          const eng = data.eng || "";

          if (!dbSentenceMap[tb]) dbSentenceMap[tb] = {};
          if (!dbSentenceMap[tb][lesson]) dbSentenceMap[tb][lesson] = [];
          
          dbSentenceMap[tb][lesson].push({ num: num, eng: eng });
        });

        const genTbSelect = document.getElementById('genTb');
        genTbSelect.innerHTML = "";
        const tbKeys = Object.keys(dbSentenceMap);

        if (tbKeys.length === 0) {
          genTbSelect.innerHTML = "<option value=''>등록된 교과서가 없습니다 (관리자 탭에서 지문을 추가하세요)</option>";
          document.getElementById('authStatusText').innerText = "✅ 인증 성공! (DB에 지문을 먼저 저장해야 펼침 목록이 나타납니다)";
          return;
        }

        tbKeys.forEach(tb => {
          const opt = document.createElement('option');
          opt.value = tb;
          opt.innerText = tb;
          genTbSelect.appendChild(opt);
        });

        document.getElementById('authStatusText').innerText = "✅ 인증 성공! 목록에서 지문을 선택해 문제지를 생성하세요.";
        updateLessonDropdown();
      } catch (err) {
        alert("DB 목록 로드 실패: " + err.message);
      }
    }

    function updateLessonDropdown() {
      const selectedTb = document.getElementById('genTb').value;
      const genLessonSelect = document.getElementById('genLesson');
      genLessonSelect.innerHTML = "";

      if (!selectedTb || !dbSentenceMap[selectedTb]) {
        genLessonSelect.innerHTML = "<option value=''>과 없음</option>";
        return;
      }

      const lessons = Object.keys(dbSentenceMap[selectedTb]).map(Number).sort((a, b) => a - b);
      lessons.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l;
        opt.innerText = `${l}과`;
        genLessonSelect.appendChild(opt);
      });

      updateSentenceDropdowns();
    }

    function updateSentenceDropdowns() {
      const selectedTb = document.getElementById('genTb').value;
      const selectedLesson = document.getElementById('genLesson').value;
      const genStartSelect = document.getElementById('genStart');
      const genEndSelect = document.getElementById('genEnd');

      genStartSelect.innerHTML = "";
      genEndSelect.innerHTML = "";

      if (!selectedTb || !selectedLesson || !dbSentenceMap[selectedTb] || !dbSentenceMap[selectedTb][selectedLesson]) {
        return;
      }

      const sentences = dbSentenceMap[selectedTb][selectedLesson];
      sentences.sort((a, b) => a.num - b.num);

      sentences.forEach(item => {
        const preview = item.eng.length > 25 ? item.eng.substring(0, 25) + "..." : item.eng;
        const label = `${item.num}번: ${preview}`;

        const optStart = document.createElement('option');
        optStart.value = item.num;
        optStart.innerText = label;
        genStartSelect.appendChild(optStart);

        const optEnd = document.createElement('option');
        optEnd.value = item.num;
        optEnd.innerText = label;
        genEndSelect.appendChild(optEnd);
      });

      if (sentences.length > 0) {
        genEndSelect.value = sentences[sentences.length - 1].num;
      }
    }

    function addAllowedPin() {
      const pin = document.getElementById('newAllowedPin').value.trim();
      if (pin.length !== 4) return alert("4자리 숫자를 입력해 주세요.");

      db.collection("allowed_users").doc(pin).set({
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert(`승인 번호 [${pin}] 번이 성공적으로 추가되었습니다.`);
        document.getElementById('newAllowedPin').value = "";
      }).catch(err => alert("추가 실패: " + err.message));
    }

    function handleSignUp() {
      const email = document.getElementById('loginEmail').value.trim();
      const pw = document.getElementById('loginPw').value;
      auth.createUserWithEmailAndPassword(email, pw)
        .then(() => alert("관리자 계정이 성공적으로 생성되었습니다!"))
        .catch(err => alert("계정 생성 오류: " + err.message));
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pw = document.getElementById('loginPw').value;
      auth.signInWithEmailAndPassword(email, pw)
        .catch(err => alert("로그인 실패: 이메일과 비밀번호를 확인해주세요."));
    }

    function handleLogout() { auth.signOut(); }

    function cleanSentence(str) {
      return str.replace(/^\d+[\.\)\:]\s*/, '').trim();
    }

    async function saveBatchToFirebase() {
      const tb = document.getElementById('dbTb').value.trim();
      const lesson = parseInt(document.getElementById('dbLesson').value);
      const startNum = parseInt(document.getElementById('dbStartNum').value);
      const rawEng = document.getElementById('dbEng').value.trim();
      const rawKor = document.getElementById('dbKor').value.trim();

      if (!tb || !rawEng || !rawKor) return alert("모든 항목을 입력해 주세요.");

      const engList = rawEng.split('\n').map(s => cleanSentence(s)).filter(s => s.length > 0);
      const korList = rawKor.split('\n').map(s => cleanSentence(s)).filter(s => s.length > 0);

      if (engList.length !== korList.length) {
        return alert(`영어 문장 수(${engList.length}개)와 한글 해석 수(${korList.length}개)가 일치하지 않습니다.`);
      }

      const batch = db.batch();

      engList.forEach((eng, idx) => {
        const currentNum = startNum + idx;
        const docRef = db.collection("sentences").doc();
        batch.set(docRef, {
          tbCode: tb,
          lesson: lesson,
          num: currentNum,
          eng: eng,
          kor: korList[idx],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      try {
        await batch.commit();
        alert(`총 ${engList.length}개의 문장이 성공적으로 DB에 등록되었습니다!`);
        document.getElementById('dbStartNum').value = startNum + engList.length;
        document.getElementById('dbEng').value = "";
        document.getElementById('dbKor').value = "";
      } catch (err) {
        alert("일괄 저장 실패: " + err.message);
      }
    }

    // 인덱스 오류가 발생하지 않도록 자바스크립트 내 필터링으로 수정된 함수
    function fetchAndGenerate() {
      if (!isPinVerified) return alert("먼저 핸드폰 번호 뒷자리 인증을 완료해 주세요.");

      const tb = document.getElementById('genTb').value;
      const lesson = parseInt(document.getElementById('genLesson').value);
      const start = parseInt(document.getElementById('genStart').value);
      const end = parseInt(document.getElementById('genEnd').value);
      const qType = document.getElementById('genType').value;

      if (!tb || isNaN(lesson) || isNaN(start) || isNaN(end)) {
        return alert("선택된 지문 데이터가 없거나 올바르지 않습니다.");
      }

      // 인덱스 에러 방지: DB에서는 교과서와 과만 검색하고 범위 필터링은 자바스크립트에서 수행
      db.collection("sentences")
        .where("tbCode", "==", tb)
        .where("lesson", "==", lesson)
        .get()
        .then(snapshot => {
          let list = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.num >= start && data.num <= end) {
              list.push(data);
            }
          });
          list.sort((a, b) => a.num - b.num);
          renderPaper(list, qType);
        })
        .catch(err => alert("조회 오류: " + err.message));
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function renderPaper(dataList, qType) {
      const paper = document.getElementById('paperArea');
      paper.style.display = "block";
      paper.innerHTML = "";

      if (dataList.length === 0) {
        paper.innerHTML = "<p style='text-align:center;'>해당 조건의 지문 데이터가 없습니다.</p>";
        return;
      }

      dataList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = "q-card";
        let html = `<div class="q-num">Q${idx + 1}. [문장 ${item.num}]</div>`;

        if (qType === "1") {
          html += `<div class="q-text">다음 문장을 해석하시오.<br><b>${item.eng}</b></div><div class="ans-space"></div>`;
        } else if (qType === "2") {
          html += `<div class="q-text">다음 우리말을 영작하시오.<br><b>${item.kor}</b></div><div class="ans-space"></div>`;
        } else if (qType === "3") {
          const words = shuffle(item.eng.replace(/[.,!?]/g, '').split(" ")).join(" / ");
          html += `<div class="q-text">주어진 단어를 올바르게 배열하시오. (${item.kor})</div><div class="word-box">[ ${words} ]</div><div class="ans-space"></div>`;
        } else if (qType === "4") {
          const words = item.eng.split(" ");
          const blanked = words.map(w => w.length > 3 && Math.random() > 0.4 ? "_______" : w).join(" ");
          html += `<div class="q-text">빈칸에 알맞은 단어를 쓰시오.<br><b>${blanked}</b></div><div style="font-size:14px; color:#666;">(뜻: ${item.kor})</div><div class="ans-space"></div>`;
        }

        card.innerHTML = html;
        paper.appendChild(card);
      });
    }
  </script>
</body>
</html>
