<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMS Middle School Test Program</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }
    #appFrame { width: 100%; height: 100%; border: 0; display: block; background: #f4f6f9; }
  </style>
</head>
<body>
  <iframe id="appFrame" title="YMS Middle School Test Program"></iframe>
  <script>
    const GRAMMAR_API_URL = 'https://yms-grammar-api.vercel.app/api/grammar';
    const frame = document.getElementById('appFrame');
    frame.src = 'legacy.html' + window.location.search + window.location.hash;

    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc || win.__ymsGrammarAiInstalled) return;
      win.__ymsGrammarAiInstalled = true;

      const style = doc.createElement('style');
      style.textContent = `
        .grammar-passage { font-size: 14px; line-height: 2.1; text-align: justify; word-break: keep-all; }
        .grammar-sentence { display: inline; margin-right: 5px; }
        .grammar-sentence-num { font-weight: 800; margin-right: 3px; }
        .grammar-toolbar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; }
        .grammar-answer-btn { background:#475569; color:#fff; font-weight:700; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-family:inherit; }
        .grammar-answer-panel { display:none; margin-top:18px; padding:14px 16px; border:1px solid #cbd5e1; border-radius:7px; background:#f8fafc; }
        .grammar-answer-panel.show { display:block; }
        .grammar-answer-title { font-size:14px; font-weight:900; margin-bottom:8px; }
        .grammar-answer-item { font-size:12.5px; line-height:1.65; margin-bottom:5px; }
        .grammar-ai-loading { text-align:center; padding:45px 10px; color:#475569; font-size:14px; font-weight:700; }
        @media print {
          .paper[data-qtype="5"] .grammar-passage { font-size:13.5px; line-height:2.15; text-align:justify; }
          .grammar-answer-btn, .grammar-answer-panel { display:none !important; }
        }
      `;
      doc.head.appendChild(style);

      const blankCol = doc.getElementById('blankOptionCol');
      if (blankCol && !doc.getElementById('grammarErrorOptionCol')) {
        const grammarCountCol = doc.createElement('div');
        grammarCountCol.className = 'col';
        grammarCountCol.id = 'grammarErrorOptionCol';
        grammarCountCol.style.display = 'none';
        grammarCountCol.innerHTML = `
          <label>문법 오류 개수</label>
          <input type="number" id="grammarErrorCount" value="5" min="1" max="15" step="1">
        `;
        blankCol.parentElement.appendChild(grammarCountCol);

        const grammarDifficultyCol = doc.createElement('div');
        grammarDifficultyCol.className = 'col';
        grammarDifficultyCol.id = 'grammarDifficultyOptionCol';
        grammarDifficultyCol.style.display = 'none';
        grammarDifficultyCol.innerHTML = `
          <label>문법 문제 난이도</label>
          <select id="grammarDifficulty">
            <option value="기본">기본</option>
            <option value="중등 내신" selected>중등 내신</option>
            <option value="고난도">고난도</option>
          </select>
        `;
        blankCol.parentElement.appendChild(grammarDifficultyCol);
      }

      function installGrammarOption() {
        const category = doc.getElementById('genCategory');
        const type = doc.getElementById('genType');
        if (!category || !type || category.value !== 'sentence') return;
        if (!type.querySelector('option[value="5"]')) {
          const option = doc.createElement('option');
          option.value = '5';
          option.textContent = '5. 문법 오류 찾기 (AI)';
          type.appendChild(option);
        }
      }

      const originalToggle = typeof win.toggleBlankOption === 'function'
        ? win.toggleBlankOption.bind(win)
        : null;

      win.toggleBlankOption = function() {
        if (originalToggle) originalToggle();
        const category = doc.getElementById('genCategory')?.value;
        const qType = doc.getElementById('genType')?.value;
        const isGrammar = category === 'sentence' && qType === '5';
        const grammarCountCol = doc.getElementById('grammarErrorOptionCol');
        const grammarDifficultyCol = doc.getElementById('grammarDifficultyOptionCol');
        if (grammarCountCol) grammarCountCol.style.display = isGrammar ? 'block' : 'none';
        if (grammarDifficultyCol) grammarDifficultyCol.style.display = isGrammar ? 'block' : 'none';
      };

      const originalUpdateLessonDropdown = typeof win.updateLessonDropdown === 'function'
        ? win.updateLessonDropdown.bind(win)
        : null;

      if (originalUpdateLessonDropdown) {
        win.updateLessonDropdown = function() {
          const result = originalUpdateLessonDropdown(...arguments);
          installGrammarOption();
          win.toggleBlankOption();
          return result;
        };
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
      }

      function renderGrammarHeader(paper, requested) {
        const brandStrip = doc.createElement('div');
        brandStrip.className = 'yms-brand-strip';
        brandStrip.innerHTML = '<div class="yms-brand-name">YMS <span>ENGLISH</span></div><div class="yms-test-type">AI GRAMMAR ERROR TEST</div>';
        paper.appendChild(brandStrip);

        const meta = doc.createElement('div');
        meta.className = 'paper-meta';
        meta.textContent = `${doc.getElementById('genTb').value}  ·  UNIT ${doc.getElementById('genLesson').value}`;
        paper.appendChild(meta);

        const header = doc.createElement('div');
        header.className = 'paper-header-row';
        header.innerHTML = `
          <div class="paper-instruction">다음 글에는 문법상 잘못된 부분이 총 <b>${requested}곳</b> 있습니다. 잘못된 부분을 찾아 바르게 고치시오.</div>
          <div class="student-info-box">
            <span>날짜: <span class="info-item" style="width:90px;"></span></span>
            <span>이름: <span class="info-item" style="width:90px;"></span></span>
          </div>
        `;
        paper.appendChild(header);
      }

      function renderGrammarResult(result, requested) {
        const paper = doc.getElementById('paperArea');
        paper.style.display = 'block';
        paper.dataset.qtype = '5';
        paper.innerHTML = '';

        const toolbar = doc.createElement('div');
        toolbar.className = 'grammar-toolbar';

        const answerBtn = doc.createElement('button');
        answerBtn.type = 'button';
        answerBtn.className = 'grammar-answer-btn';
        answerBtn.textContent = '정답 보기';

        const printBtn = doc.createElement('button');
        printBtn.className = 'btn-print';
        printBtn.style.float = 'none';
        printBtn.style.marginBottom = '0';
        printBtn.textContent = '🖨️ 시험지 인쇄하기';
        printBtn.onclick = () => win.print();

        toolbar.appendChild(answerBtn);
        toolbar.appendChild(printBtn);
        paper.appendChild(toolbar);

        renderGrammarHeader(paper, requested);

        const passage = doc.createElement('div');
        passage.className = 'grammar-passage';
        passage.innerHTML = result.sentences.map((item, idx) =>
          `<span class="grammar-sentence"><span class="grammar-sentence-num">${idx + 1}.</span>${escapeHtml(item.question)}</span>`
        ).join(' ');
        paper.appendChild(passage);

        const answerPanel = doc.createElement('div');
        answerPanel.className = 'grammar-answer-panel';
        const errors = result.sentences.filter(item => item.hasError);
        answerPanel.innerHTML = `
          <div class="grammar-answer-title">교사용 정답 · ${escapeHtml(result.difficulty || '')}</div>
          ${errors.map(item => `
            <div class="grammar-answer-item">
              <b>${item.number}번</b> ${escapeHtml(item.wrong)} → <b>${escapeHtml(item.correct)}</b>
              &nbsp;[${escapeHtml(item.grammarPoint)}]&nbsp; ${escapeHtml(item.reason)}
            </div>
          `).join('')}
        `;
        paper.appendChild(answerPanel);

        answerBtn.onclick = () => {
          answerPanel.classList.toggle('show');
          answerBtn.textContent = answerPanel.classList.contains('show') ? '정답 숨기기' : '정답 보기';
        };

        paper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      async function generateGrammarPaper(dataList) {
        const requested = parseInt(doc.getElementById('grammarErrorCount')?.value || '5', 10);
        const difficulty = doc.getElementById('grammarDifficulty')?.value || '중등 내신';
        const maxErrors = Math.min(15, dataList.length);

        if (!Number.isInteger(requested) || requested < 1 || requested > maxErrors) {
          win.alert(`문법 오류 개수는 1~${maxErrors}개 사이로 입력해 주세요.`);
          return;
        }

        const paper = doc.getElementById('paperArea');
        paper.style.display = 'block';
        paper.dataset.qtype = '5';
        paper.innerHTML = '<div class="grammar-ai-loading">AI가 지문을 분석해서 내신형 문법 오류 문제를 만들고 있습니다...</div>';
        paper.scrollIntoView({ behavior: 'smooth', block: 'start' });

        try {
          const response = await fetch(GRAMMAR_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sentences: dataList.map(item => ({ num: item.num, eng: item.eng })),
              errorCount: requested,
              difficulty
            })
          });

          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(result.error || `API 오류 (${response.status})`);
          }
          if (!Array.isArray(result.sentences)) {
            throw new Error('AI 응답 형식이 올바르지 않습니다.');
          }

          renderGrammarResult(result, requested);
        } catch (error) {
          console.error(error);
          paper.innerHTML = `
            <div class="grammar-ai-loading" style="color:#dc2626;">
              문법 문제 생성에 실패했습니다.<br>
              <span style="font-size:12px;font-weight:500;">${escapeHtml(error.message || '잠시 후 다시 시도해 주세요.')}</span>
            </div>
          `;
        }
      }

      const originalRenderPaper = typeof win.renderPaper === 'function'
        ? win.renderPaper.bind(win)
        : null;

      if (originalRenderPaper) {
        win.renderPaper = function(dataList, qType, category) {
          if (category === 'sentence' && qType === '5') {
            generateGrammarPaper(dataList);
            return;
          }
          return originalRenderPaper(dataList, qType, category);
        };
      }

      installGrammarOption();
      win.toggleBlankOption();
    });
  </script>
</body>
</html>
