name: Normalize CRLF

on:
  push:
    branches: [fix/vocab-lesson-refresh-20260813]
    paths: [.github/workflows/normalize-crlf.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocab-lesson-refresh-20260813
      - run: python .github/scripts/normalize_crlf.py
      - run: |
          rm -f .github/scripts/normalize_crlf.py .github/workflows/normalize-crlf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/normalize_crlf.py .github/workflows/normalize-crlf.yml || true
          git commit -m "Preserve index HTML line endings"
          git push
