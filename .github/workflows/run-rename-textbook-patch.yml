name: School Test textbook rename patch

on:
  push:
    branches:
      - feat/rename-textbook-20260813
    paths:
      - .github/workflows/run-rename-textbook-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rename-textbook-20260813

      - name: Patch textbook rename UI
        run: python .github/scripts/patch_rename_textbook.py

      - name: Validate inline JavaScript
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          inline = [b for b in blocks if b.strip()]
          Path('/tmp/app.js').write_text('\n'.join(inline), encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q "renameDbTextbook" index.html
          grep -q "교과서 이름 변경" index.html

      - name: Remove temporary patch files
        run: rm -f .github/scripts/patch_rename_textbook.py .github/workflows/run-rename-textbook-patch.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch_rename_textbook.py .github/workflows/run-rename-textbook-patch.yml || true
          git commit -m "Add textbook rename support" || exit 0
          git push
