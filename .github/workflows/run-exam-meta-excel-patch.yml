name: School Test exam meta and Excel export patch

on:
  push:
    branches:
      - feat/exam-meta-excel-export-20260813
    paths:
      - .github/workflows/run-exam-meta-excel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exam-meta-excel-export-20260813

      - name: Apply patch
        run: python .github/scripts/patch_exam_meta_excel.py

      - name: Repair escaped newline in generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          raw = path.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          text = raw.decode('utf-8')
          bad = 'join("' + newline + '   ")'
          good = 'join("\\n   ")'
          if bad not in text:
              raise SystemExit('Expected generated join newline was not found')
          text = text.replace(bad, good, 1)
          path.write_bytes(text.encode('utf-8'))
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I):
              if 'src=' not in attrs.lower():
                  scripts.append(body)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Remove one-time patch files
        run: rm -f .github/scripts/patch_exam_meta_excel.py .github/workflows/run-exam-meta-excel-patch.yml

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch_exam_meta_excel.py .github/workflows/run-exam-meta-excel-patch.yml || true
          git commit -m "Show textbook metadata and export vocabulary to Excel" || exit 0
          git push
