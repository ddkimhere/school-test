name: School Test footer bottom patch

on:
  push:
    branches:
      - fix/footer-bottom-20260813
    paths:
      - .github/workflows/run-footer-bottom-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/footer-bottom-20260813

      - name: Apply footer positioning patch
        run: python .github/scripts/patch_footer_bottom.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I):
              if 'src=' not in attrs.lower():
                  scripts.append(body)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Verify footer layout CSS
        run: |
          grep -F "min-height: 1120px" index.html
          grep -F "min-height: 281mm" index.html
          grep -F ".q-container { display: block; flex: 1 0 auto; }" index.html
          grep -F "margin-top: auto" index.html

      - name: Remove one-time patch files
        run: rm -f .github/scripts/patch_footer_bottom.py .github/workflows/run-footer-bottom-patch.yml

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch_footer_bottom.py .github/workflows/run-footer-bottom-patch.yml || true
          git commit -m "Pin YMS test footer to bottom of paper" || exit 0
          git push
