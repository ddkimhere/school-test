name: School Test YMS outline patch

on:
  push:
    branches:
      - feat/yms-test-outline-20260813
    paths:
      - .github/workflows/run-yms-test-outline-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yms-test-outline-20260813

      - name: Apply YMS outline patch
        run: python .github/scripts/patch_yms_test_outline.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I):
              if 'src=' not in attrs.lower():
                  scripts.append(body)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Remove one-time patch files
        run: rm -f .github/scripts/patch_yms_test_outline.py .github/workflows/run-yms-test-outline-patch.yml

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch_yms_test_outline.py .github/workflows/run-yms-test-outline-patch.yml || true
          git commit -m "Apply YMS branded test paper outline" || exit 0
          git push
