name: Patch cloze test layout
on:
  push:
    paths:
      - '.github/workflows/patch-cloze-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve cloze spacing and font size
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8").replace("\r\n", "\n")

          css_anchor = '''      .paper[data-qtype="1"] .q-container.sentence-grid .ans-space,
      .paper[data-qtype="2"] .q-container.sentence-grid .ans-space { height: 30px; margin-top: 2px; }
'''
          css_replacement = css_anchor + '''
      /* 빈칸 채우기: 15문항 유지 + 가독성 확대 */
      .paper[data-qtype="4"] .q-container.sentence-grid .q-card { margin-bottom: 11px; }
      .paper[data-qtype="4"] .q-container.sentence-grid .q-text { font-size: 14px; line-height: 1.45; margin-bottom: 5px; }
      .paper[data-qtype="4"] .q-container.sentence-grid .cloze-meaning { font-size: 12.5px; line-height: 1.4; color: #555; margin-top: 0; }
'''
          if '빈칸 채우기: 15문항 유지 + 가독성 확대' not in s:
              if css_anchor not in s:
                  raise SystemExit("CSS anchor not found")
              s = s.replace(css_anchor, css_replacement, 1)

          old = 'html = `<div class="q-text"><b>${qNumberStr}${blanked}</b></div><div style="font-size:12px; color:#555; margin-top:-3px;">(뜻: ${item.kor})</div>`;'
          new = 'html = `<div class="q-text"><b>${qNumberStr}${blanked}</b></div><div class="cloze-meaning">(뜻: ${item.kor})</div>`;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Cloze meaning anchor not found")

          p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-cloze-layout.yml
          git add index.html
          git diff --cached --check
          git commit -m "Improve cloze test spacing and font size"
          git push
