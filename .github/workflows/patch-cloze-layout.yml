name: Patch cloze test layout
on:
  push:
    paths:
      - '.github/workflows/patch-cloze-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve cloze spacing and font size
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit index change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Improve cloze test spacing and font size"
          git push
