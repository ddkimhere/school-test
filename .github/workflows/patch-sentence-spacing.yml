name: Widen sentence test spacing
on:
  push:
    paths:
      - '.github/workflows/patch-sentence-spacing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen sentence test spacing
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit index change
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Widen sentence test answer spacing"
          git push
