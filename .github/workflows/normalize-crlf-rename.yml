name: Normalize CRLF rename patch

on:
  push:
    branches:
      - feat/rename-textbook-20260813
    paths:
      - .github/workflows/normalize-crlf-rename.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rename-textbook-20260813
      - run: python .github/scripts/normalize_crlf_rename.py
      - run: rm -f .github/scripts/normalize_crlf_rename.py .github/workflows/normalize-crlf-rename.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/normalize_crlf_rename.py .github/workflows/normalize-crlf-rename.yml || true
          git commit -m "Normalize line endings" || exit 0
          git push
