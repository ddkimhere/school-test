name: Increase sentence test spacing v2
on:
  push:
    paths:
      - '.github/workflows/patch-sentence-spacing-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sentence spacing by question type
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit index change
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase sentence answer line spacing"
          git push
