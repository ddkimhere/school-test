name: School Test DB editor patch

on:
  push:
    branches:
      - feat/db-editor-sort-20260813
    paths:
      - .github/workflows/run-db-editor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/db-editor-sort-20260813

      - name: Patch School Test
        run: python .github/scripts/patch_db_editor.py

      - name: Validate patched HTML and JavaScript
        run: |
          grep -q 'localeCompare(String(b), "ko-KR"' index.html
          grep -q 'async function loadDbEditor()' index.html
          grep -q 'async function deleteDbLesson()' index.html
          grep -q '데이터베이스 조회 / 수정 / 삭제' index.html
          python <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not matches:
              raise SystemExit('inline script not found')
          main = max(matches, key=len)
          Path('/tmp/school-test-main.js').write_text(main, encoding='utf-8')
          PY
          node --check /tmp/school-test-main.js

      - name: Remove one-time patch files
        run: rm -f .github/scripts/patch_db_editor.py .github/workflows/run-db-editor-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch_db_editor.py .github/workflows/run-db-editor-patch.yml || true
          git commit -m "Sort textbooks and add database editor" || exit 0
          git push
