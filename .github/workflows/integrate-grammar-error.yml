          grammar_helpers = r'''
    function grammarCoreParts(token) {
      const m = token.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
      return m ? { pre: m[1], core: m[2], post: m[3] } : null;
    }

    function preserveGrammarCase(original, replacement) {
      if (original === original.toUpperCase()) return replacement.toUpperCase();
      if (original[0] === original[0].toUpperCase()) return replacement[0].toUpperCase() + replacement.slice(1);
      return replacement;
    }

    function replaceGrammarCore(token, replacement) {
      const p = grammarCoreParts(token);
      if (!p) return token;
      return p.pre + preserveGrammarCase(p.core, replacement) + p.post;
    }

    function grammarThirdPerson(verb) {
      if (verb === 'be') return 'is';
      if (verb === 'have') return 'has';
      if (verb === 'do') return 'does';
      if (/[^aeiou]y$/i.test(verb)) return verb.slice(0, -1) + 'ies';
      if (/(s|sh|ch|x|z|o)$/i.test(verb)) return verb + 'es';
      return verb + 's';
    }

    const grammarDirectMap = {
      am: 'are', is: 'are', are: 'is', was: 'were', were: 'was',
      has: 'have', have: 'has', do: 'does', does: 'do',
      a: 'an', an: 'a', this: 'these', these: 'this', that: 'those', those: 'that',
      he: 'him', him: 'he', she: 'her', her: 'she', they: 'them', them: 'they',
      we: 'us', us: 'we', i: 'me', me: 'i', my: 'me', our: 'us', their: 'them'
    };

    const grammarModalSet = new Set(['can', 'could', 'will', 'would', 'should', 'must', 'may', 'might', 'shall']);
    const grammarBaseVerbSet = new Set([
      'be','have','do','go','come','make','take','see','know','get','give','find','think','use','work','play','read','write',
      'eat','drink','help','learn','study','become','keep','feel','leave','put','mean','tell','ask','seem','try','call','need',
      'want','like','look','start','move','live','believe','bring','happen','provide','include','continue','change','watch',
      'follow','stop','create','speak','spend','grow','open','walk','win','teach','offer','remember','consider','appear','buy',
      'wait','serve','send','build','stay','fall','cut','reach','understand'
    ]);

    const grammarPpToBase = {
      been:'be', done:'do', gone:'go', seen:'see', made:'make', taken:'take', written:'write', known:'know', given:'give',
      found:'find', thought:'think', used:'use', come:'come', become:'become', read:'read', built:'build', sent:'send',
      kept:'keep', left:'leave', felt:'feel', told:'tell', brought:'bring', bought:'buy', spoken:'speak', grown:'grow',
      understood:'understand'
    };

    function getGrammarCandidates(sentence) {
      const words = String(sentence || '').split(/\s+/).filter(Boolean);
      const cores = words.map(w => (grammarCoreParts(w)?.core || '').toLowerCase());
      const candidates = [];
      const usedIndex = new Set();
      const add = (index, replacement, kind) => {
        if (index < 0 || index >= words.length || usedIndex.has(index) || !grammarCoreParts(words[index])) return;
        if ((grammarCoreParts(words[index])?.core || '').toLowerCase() === replacement.toLowerCase()) return;
        usedIndex.add(index);
        candidates.push({ index, replacement, kind });
      };

      cores.forEach((core, i) => {
        if (grammarDirectMap[core]) add(i, grammarDirectMap[core], 'basic');
      });

      for (let i = 0; i < cores.length - 1; i++) {
        const core = cores[i];
        let j = i + 1;
        if (cores[j] === 'not' && j + 1 < cores.length) j++;
        const next = cores[j];
        if (grammarModalSet.has(core) && grammarBaseVerbSet.has(next)) add(j, grammarThirdPerson(next), 'modal');
        if ((core === 'do' || core === 'does' || core === 'did') && grammarBaseVerbSet.has(next)) add(j, grammarThirdPerson(next), 'auxiliary');
        if (core === 'to' && grammarBaseVerbSet.has(next)) add(j, grammarThirdPerson(next), 'infinitive');
        if ((core === 'have' || core === 'has' || core === 'had') && grammarPpToBase[next]) add(j, grammarPpToBase[next], 'perfect');
      }

      return { words, candidates };
    }

    function makeGrammarErrors(items, requestedCount) {
      const working = items.map(item => ({ ...item, grammarParsed: getGrammarCandidates(item.eng) }));
      const bySentence = working.map((item, sentenceIndex) =>
        item.grammarParsed.candidates.map(candidate => ({ ...candidate, sentenceIndex }))
      );
      const selected = [];
      const used = new Set();

      shuffle([...bySentence.keys()]).forEach(sentenceIndex => {
        if (selected.length >= requestedCount) return;
        const pool = bySentence[sentenceIndex].filter(c => !used.has(`${sentenceIndex}:${c.index}`));
        if (!pool.length) return;
        const pick = pool[Math.floor(Math.random() * pool.length)];
        selected.push(pick);
        used.add(`${sentenceIndex}:${pick.index}`);
      });

      if (selected.length < requestedCount) {
        const rest = shuffle(bySentence.flat().filter(c => !used.has(`${c.sentenceIndex}:${c.index}`)));
        for (const candidate of rest) {
          if (selected.length >= requestedCount) break;
          selected.push(candidate);
          used.add(`${candidate.sentenceIndex}:${candidate.index}`);
        }
      }

      const available = bySentence.flat().length;
      if (selected.length < requestedCount) return { ok: false, available };

      selected.forEach(candidate => {
        const parsed = working[candidate.sentenceIndex].grammarParsed;
        parsed.words[candidate.index] = replaceGrammarCore(parsed.words[candidate.index], candidate.replacement);
      });

      return {
        ok: true,
        items: working.map(item => ({ ...item, grammarText: item.grammarParsed.words.join(' ') })),
        selected
      };
    }

    function escapeTestHtml(value) {
      return String(value ?? '').replace(/[&<>\"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;'
      }[ch]));
    }

'''

