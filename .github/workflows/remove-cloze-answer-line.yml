name: Remove cloze answer line
on:
  push:
    paths:
      - '.github/workflows/remove-cloze-answer-line.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove underline from cloze items
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8').replace('\r\n','\n')
          old = '''            html = `<div class="q-text"><b>${qNumberStr}${blanked}</b></div><div style="font-size:12px; color:#555; margin-top:-3px;">(뜻: ${item.kor})</div><div class="ans-space"></div>`;'''
          new = '''            html = `<div class="q-text"><b>${qNumberStr}${blanked}</b></div><div style="font-size:12px; color:#555; margin-top:-3px;">(뜻: ${item.kor})</div>`;'''
          if old not in s:
              raise SystemExit('cloze render block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/remove-cloze-answer-line.yml
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html .github/workflows/remove-cloze-answer-line.yml
          git commit -m "Remove answer underline from cloze test"
          git push
