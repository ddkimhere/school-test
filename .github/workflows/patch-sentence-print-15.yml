name: Patch sentence print to 15 per A4
on:
  push:
    paths:
      - '.github/workflows/patch-sentence-print-15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sentence print layout
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set sentence print to 15 items per A4"
          git push
