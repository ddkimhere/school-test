name: Patch sentence print to 15 per A4
on:
  push:
    paths:
      - '.github/workflows/patch-sentence-print-15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sentence print layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          old_class = 'container.className = (category === "vocab") ? "q-container vocab-grid" : "q-container";'
          new_class = 'container.className = (category === "vocab") ? "q-container vocab-grid" : "q-container sentence-grid";'
          if old_class in s:
              s = s.replace(old_class, new_class, 1)
          elif new_class not in s:
              raise SystemExit('sentence container class anchor not found')

          marker = '      /* 문장 시험: A4 한 장에 15문항씩 */'
          if marker not in s:
              old_css = '''      .yms-brand-strip { border-top-color: #000; border-bottom-color: #000; padding-top: 8px; padding-bottom: 7px; }
      .yms-brand-name, .yms-brand-name span, .yms-test-type, .paper-meta { color: #000; }
      .yms-test-type { border-color: #000; }
      .paper-header-row { background: #fff; border-left-color: #000; margin-bottom: 10px; padding: 7px 10px; }
      .paper-instruction, .student-info-box { color: #000; }
      .info-item { border-bottom-color: #000; }
      
      .q-card { margin-bottom: 8px; }
      .q-text { font-size: 13px; }
      .ans-space { height: 16px; border-bottom-color: #000; }
'''
              new_css = '''      .yms-brand-strip { border-top-color: #000; border-bottom-color: #000; padding-top: 5px; padding-bottom: 4px; }
      .yms-brand-name { font-size: 18px; }
      .yms-brand-name, .yms-brand-name span, .yms-test-type, .paper-meta { color: #000; }
      .yms-test-type { border-color: #000; }
      .paper-meta { font-size: 15px; margin: 6px 0 5px 0; }
      .paper-header-row { background: #fff; border-left-color: #000; margin-bottom: 6px; padding: 5px 8px; }
      .paper-instruction { font-size: 12.5px; line-height: 1.25; }
      .paper-instruction, .student-info-box { color: #000; }
      .student-info-box { font-size: 11.5px; }
      .info-item { border-bottom-color: #000; }
      
      .q-card { margin-bottom: 8px; }
      .q-text { font-size: 13px; }
      .ans-space { height: 16px; border-bottom-color: #000; }

      /* 문장 시험: A4 한 장에 15문항씩 */
      .q-container.sentence-grid .q-card {
        margin-bottom: 3px;
        padding-bottom: 0;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .q-container.sentence-grid .q-text {
        font-size: 11px;
        line-height: 1.2;
        margin-bottom: 1px;
      }
      .q-container.sentence-grid .ans-space {
        height: 11px;
        margin-top: 1px;
        border-bottom-color: #000;
      }
      .q-container.sentence-grid .word-box {
        font-size: 10px;
        line-height: 1.15;
        padding: 2px 5px;
        margin-bottom: 1px;
      }
      .q-container.sentence-grid .q-card:nth-child(15n + 1):not(:first-child) {
        break-before: page;
        page-break-before: always;
      }
'''
              if old_css not in s:
                  raise SystemExit('print CSS anchor not found')
              s = s.replace(old_css, new_css, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set sentence print to 15 items per A4"
          git push
